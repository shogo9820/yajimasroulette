<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>やじまズルーレット</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="app-container">
    <header>
      <!-- タイトル3回タップで隠し設定を表示 -->
      <h1 id="appTitle">やじまズルーレット</h1>
    </header>

    <!-- 1️⃣ 設定画面 -->
    <div id="setupView" class="view-section active">
      <!-- 📋 テンプレート管理エリア -->
      <div class="template-section">
        <select id="templateSelect">
          <option value="">-- 保存されたテンプレート --</option>
        </select>
        <div class="template-actions">
          <button id="saveTemplateBtn" class="btn-sub">保存</button>
          <button id="deleteTemplateBtn" class="btn-sub btn-alert">削除</button>
        </div>
      </div>

      <div class="controls-section">
        <!-- 📝 目的（何を決めるか）の入力欄 -->
        <div class="purpose-container">
          <input type="text" id="purposeInput" placeholder="例：ドラえもんの刑、はまち等">
        </div>

        <div class="section-header">
          <span>項目設定</span>
          <span class="section-hint">名称 / 幅</span>
        </div>
        <div id="itemsContainer" class="items-scroll"></div>
        <button id="addBtn" class="btn-add">＋ 項目を追加</button>
      </div>
      
      <div class="action-bar">
        <button id="generateBtn" class="action-btn next-btn">ルーレットを作成する</button>
      </div>
    </div>

    <!-- 2️⃣ ルーレット画面 -->
    <div id="wheelView" class="view-section">
      <div class="wheel-section">
        <!-- 🎯 ルーレットタイトルの表示エリア -->
        <div id="wheelTitleDisplay" class="wheel-title-display"></div>

        <div class="roulette-container">
          <div class="pointer" aria-hidden="true">
            <svg width="32" height="28" viewBox="0 0 32 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 25.5C14.8 25.5 13.7 24.8 13.1 23.7L3.6 7.2C2.4 5.1 3.9 2.5 6.3 2.5H25.7C28.1 2.5 29.6 5.1 28.4 7.2L18.9 23.7C18.3 24.8 17.2 25.5 16 25.5Z" fill="#f17886" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
            </svg>
          </div>
          <canvas id="wheel"></canvas>
        </div>
        <div id="result" class="result-display"></div>
      </div>

      <!-- 🎰 ボタンエリア（特殊演出時はJS側で表示・非表示を切り替え） -->
      <div class="action-bar" style="position: relative;">
        <button id="backBtn" class="action-btn secondary-btn">戻る</button>
        <button id="spinBtn" class="action-btn">スタート</button>
        <button id="stopBtn" class="action-btn" disabled>ストップ！</button>
        
        <!-- 🎰 特殊演出時専用：巨大赤丸アクションボタン（初期状態は非表示） -->
        <button id="pachiActionBtn" class="pachi-red-button" style="display: none;">押せっ！</button>
      </div>
    </div>
  </div>

  <!-- 隠し設定用モーダル（タイトル3回タップで出現） -->
  <div id="secretModal" class="secret-modal-bg">
    <div class="secret-modal-content">
      <h3 class="secret-modal-title">ターゲット・仕込み設定</h3>
      
      <!-- 🎰 独立設定①：特殊演出ルーレットに切り替わる確率設定 -->
      <div class="secret-field">
        <label class="secret-label secret-label--accent">🎰 特殊演出 発生確率</label>
        <div class="secret-prob-row">
          <input type="number" id="secretProbability" class="secret-prob-input" min="0" max="100" value="0">
          <span class="secret-percent">％</span>
        </div>
        <p class="secret-note">※当選時はスタート直後にプチュン暗転し、コード固定の別格ルーレットに切り替わります。</p>
      </div>

      <!-- 🎯 独立設定②：元々の機能である通常項目のターゲット指定 -->
      <div class="secret-field secret-field--divider">
        <label class="secret-label" id="secretSelectLabel">🎯 通常盤面時の確定ターゲット</label>
        <select id="secretSelect" class="secret-select-native" aria-hidden="true" tabindex="-1">
          <option value="random">【通常】仕込みなし</option>
        </select>
        <div id="secretDropdown" class="custom-select">
          <button type="button" id="secretDropdownTrigger" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="secretSelectLabel secretDropdownValue">
            <span class="custom-select-trigger-main">
              <span id="secretDropdownDot" class="custom-select-dot custom-select-dot--neutral"></span>
              <span id="secretDropdownValue" class="custom-select-value">【通常】仕込みなし</span>
            </span>
            <svg class="custom-select-chevron" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M5.5 7.75L10 12.25L14.5 7.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div id="secretDropdownMenu" class="custom-select-menu" role="listbox" aria-labelledby="secretSelectLabel"></div>
        </div>
      </div>

      <button id="closeSecretBtn" class="secret-submit-btn">決定</button>
    </div>
  </div>

  <!-- 🎰 パチスロ風の確定演出用オーバーレイ画面 -->
  <div id="pachislotEffect" class="pachislot-overlay">
    <div class="pachislot-content">
      <div class="pachislot-flash"></div>
      <div class="pachislot-title">激熱</div>
      <div class="pachislot-message">激熱演出発生！？</div>
      <div class="pachislot-sub">やじまの運命を決めろ！！！</div>
    </div>
  </div>

  <script src="./js/audio.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
